<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Popup Infopedia - Custom Viewer</title>
    <link rel="stylesheet" href="custom-viewer.css">
</head>
<body>
    <!-- Parser-blocking theme bootstrap: applies dark-mode from the
         localStorage mirror before anything renders, so the page never
         flashes light while waiting on the async chrome.storage read.
         See theme-bootstrap.js and the mirror writers in custom-viewer.js. -->
    <script src="theme-bootstrap.js"></script>
    <div id="toolbar">
        <div id="toolbar-left" style="display: flex; align-items: center; gap: 5px;">
            <span>Page:</span>
            <input type="number" id="page_num" value="1" min="1">
            <span>/ <span id="page_count"></span></span>
        </div>
        <div id="toolbar-center" style="display: flex; align-items: center; gap: 5px;">
            <button id="zoom_out" title="Zoom Out">-</button>
            <span id="zoom_level" style="min-width: 45px; text-align: center;">100%</span>
            <button id="zoom_in" title="Zoom In">+</button>
            <div style="width: 10px;"></div>
            <button id="fit_width" title="Fit to Width">Fit Width</button>
            <button id="fit_page" title="Fit to Page">Fit Page</button>
            <div style="width: 10px;"></div>
            <button id="dark_mode_toggle" title="Toggle Dark Mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark Mode</button>
        </div>
        <div id="toolbar-right">
            <div id="findbar">
                <input type="text" id="findInput" placeholder="Find in document..." />
                <span id="findResults">0 / 0</span>
                <button id="findPrevious" title="Previous match">↑</button>
                <button id="findNext" title="Next match">↓</button>
            </div>
            <button id="print_pdf" title="Print Document"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print</button>
            <button id="bookmark_page" title="Bookmark current page"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Bookmark</button>
            <button id="summarize_page" title="Summarize current page"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.287-1.287Z"/></svg> Summarize Page</button>
            <button id="export_md" title="Export Notes to Markdown"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Export MD</button>
            <button id="save_pdf" title="Save PDF with Highlights"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</button>
        </div>
    </div>

    <div id="mainContainer">
        <div id="viewerContainer">
            <!-- Pages will be rendered here -->
            <div id="viewer" class="pdfViewer"></div>
        </div>
        <div id="sidebar" class="hidden">
            <div id="sidebar-header">
                <button id="close_sidebar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                <h3 id="sidebar-title">Bookmarks</h3>
                <div id="sidebar-header-actions" style="flex:1; text-align:right;">
                    <!-- Additional icons could go here -->
                </div>
            </div>
            <div id="sidebar-content-bookmarks" class="hidden">
                <!-- Bookmarks will be dynamically injected here -->
            </div>
            <div id="sidebar-content-comments" class="hidden">
                <!-- Highlights will be dynamically injected here -->
            </div>
            <div id="sidebar-content-outline" class="hidden">
                <!-- Outline will be dynamically injected here -->
            </div>
        </div>
        
        <!-- Sidebar Icons Strip (Always visible on the right) -->
        <div id="sidebar-icons">
            <button id="icon-tab-bookmarks" title="Bookmarks" data-tab="bookmarks"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
            <button id="icon-tab-outline" title="Outline" data-tab="outline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
            <button id="icon-tab-comments" title="Comments" data-tab="comments"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
        </div>
    </div>

    <!-- AI Popup is handled dynamically by content.js -->

    <!-- Color Picker Popup -->
    <div id="color-picker-popup" class="hidden">
        <div id="markup-tools">
            <button class="markup-tool-btn active" data-type="Highlight" title="Highlight"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
            <button class="markup-tool-btn" data-type="Underline" title="Underline"><u>U</u></button>
            <button class="markup-tool-btn" data-type="StrikeOut" title="Strikethrough"><s>S</s></button>
            <div style="flex:1"></div>
            <button id="ai-btn-new" title="Ask AI" style="background: none; border: none; cursor: pointer; color: #555; font-size: 14px; padding: 2px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></button>
            <button id="close-color-picker" style="background: none; border: none; cursor: pointer; color: #666; font-size: 14px; padding: 2px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div id="color-tools" style="display: flex; gap: 5px; justify-content: center;">
            <button class="color-btn" style="background-color: #FFFF98;" data-color="#FFFF98"></button>
            <button class="color-btn" style="background-color: #53FFBC;" data-color="#53FFBC"></button>
            <button class="color-btn" style="background-color: #80EBFF;" data-color="#80EBFF"></button>
            <button class="color-btn" style="background-color: #FFCBE6;" data-color="#FFCBE6"></button>
            <button class="color-btn" style="background-color: #FF4F5F;" data-color="#FF4F5F"></button>
        </div>
    </div>

    <div id="edit-highlight-popup" class="hidden">
        <button id="edit-btn-ai" title="Ask AI"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></button>
        <button id="edit-btn-note" title="Add Note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
        <button id="edit-btn-color" title="Change Color"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg></button>
        <button id="edit-btn-trash" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>

    <!-- Note Editor Popup -->
    <div id="note-editor-popup" class="hidden">
        <textarea id="note-textarea" placeholder="Add a note..."></textarea>
        <div id="note-editor-actions">
            <button id="note-btn-cancel">Cancel</button>
            <button id="note-btn-save">Save</button>
        </div>
    </div>

    <!-- Hidden print surface: printPDF() renders every page into canvases
         here; @media print swaps it in for the virtualized viewer, which
         only holds the visible pages and would otherwise print blank. -->
    <div id="print-container"></div>
    <div id="print-overlay" class="hidden">
        <div id="print-overlay-card">
            <div id="print-progress">Preparing pages for printing…</div>
            <button id="print-cancel">Cancel</button>
        </div>
    </div>

    <script src="../../pdf-lib.min.js"></script>
    <script src="../../content.js"></script>
    <script type="module" src="custom-viewer.js"></script>
</body>
</html>
