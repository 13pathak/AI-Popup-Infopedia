<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Popup Infopedia - Custom Viewer</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../../icons/icon16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../icons/icon32.png">
    <link rel="preload" href="../../fonts/GoogleSans-VariableFont_GRAD,opsz,wght.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="../../fonts/GoogleSans-Italic-VariableFont_GRAD,opsz,wght.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="custom-viewer.css">
</head>
<body>
    <!-- Parser-blocking theme bootstrap: applies dark-mode from the
         localStorage mirror before anything renders, so the page never
         flashes light while waiting on the async chrome.storage read.
         See theme-bootstrap.js and the mirror writers in custom-viewer.js. -->
    <script src="theme-bootstrap.js"></script>
    <header id="toolbar" aria-label="PDF workspace">
        <div class="document-bar">
            <div class="document-identity">
                <span class="document-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8M8 17h5"/></svg></span>
                <div class="document-heading">
                    <h1 id="document-title">PDF document</h1>
                    <span class="document-subtitle">AI Popup Infopedia <span aria-hidden="true">/</span> PDF reader</span>
                </div>
            </div>
            <div id="toolbar-left" role="group" aria-label="Document navigation">
                <div class="control-group page-navigation">
                    <button id="previous_page" class="icon-button" type="button" title="Previous page" aria-label="Previous page" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
                    <label class="sr-only" for="page_num">Page number</label>
                    <input type="number" id="page_num" value="1" min="1" inputmode="numeric">
                    <span class="page-total"><span aria-hidden="true">/</span><span class="sr-only">of</span> <span id="page_count">—</span></span>
                    <button id="next_page" class="icon-button" type="button" title="Next page" aria-label="Next page" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 7 5 5-5 5"/></svg></button>
                </div>
                <div id="findbar" role="search" aria-label="Find in document">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
                    <input type="search" id="findInput" placeholder="Find in document" aria-label="Find in document" aria-description="Press Enter to search. Press Arrow Down to focus results." autocomplete="off">
                    <span id="findResults" role="status" aria-live="polite">0 / 0</span>
                    <button id="findPrevious" class="icon-button" type="button" title="Previous match" aria-label="Previous match"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg></button>
                    <button id="findNext" class="icon-button" type="button" title="Next match" aria-label="Next match"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
                </div>
            </div>
            <div id="toolbar-center" role="group" aria-label="View controls">
                <div class="control-group zoom-controls">
                    <button id="zoom_out" class="icon-button" type="button" title="Zoom out" aria-label="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
                    <span id="zoom_level" aria-label="Zoom level">125%</span>
                    <button id="zoom_in" class="icon-button" type="button" title="Zoom in" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
                </div>
                <button id="fit_width" class="fit-button" type="button" title="Fit to width" aria-label="Fit to width"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5v14M21 5v14M7 12h10m-7-3-3 3 3 3m4-6 3 3-3 3"/></svg><span class="button-label">Fit width</span></button>
                <button id="fit_page" class="fit-button" type="button" title="Fit to page" aria-label="Fit to page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M10 7h4M10 17h4"/></svg><span class="button-label">Fit page</span></button>
                <button id="dark_mode_toggle" class="icon-button" type="button" title="Switch to dark mode" aria-label="Switch to dark mode" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            </div>
            <div id="toolbar-annotations" role="group" aria-label="Annotations and AI">
                <button id="bookmark_page" class="icon-button" type="button" title="Bookmark current page" aria-label="Bookmark current page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
                <button id="undo_annotation" class="icon-button" type="button" title="Undo annotation change (Ctrl+Z)" aria-label="Undo annotation change (Ctrl+Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
                <button id="redo_annotation" class="icon-button" type="button" title="Redo annotation change (Ctrl+Y / Ctrl+Shift+Z)" aria-label="Redo annotation change (Ctrl+Y / Ctrl+Shift+Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
                <button id="summarize_page" class="ai-button" type="button" title="Summarize current page" aria-label="Summarize current page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.287-1.287Z"/></svg><span class="button-label">Summarize</span></button>
            </div>
            <div class="document-actions" role="group" aria-label="Print and export">
                <button id="print_pdf" class="icon-button" type="button" title="Print document" aria-label="Print document"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
                <div id="export-menu-wrap">
                    <button id="export_toggle" class="secondary-button" type="button" title="Export annotations and notes" aria-label="Export annotations and notes" aria-haspopup="menu" aria-expanded="false" aria-controls="export-format-menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7m0-7L11 13"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg><span class="button-label">Export</span></button>
                    <div id="export-format-menu" class="hidden" role="menu" aria-label="Export format">
                        <button id="export_md" class="export-format-item" role="menuitem" title="Human-readable notes document">Markdown (.md)</button>
                        <button id="export_json" class="export-format-item" role="menuitem" title="Structured backup for round-tripping">JSON (.json)</button>
                        <button id="export_csv" class="export-format-item" role="menuitem" title="Flat table for spreadsheets, Notion or Anki">CSV (.csv)</button>
                    </div>
                </div>
                <button id="save_pdf" class="primary-button" type="button" title="Save PDF with highlights" aria-label="Save PDF with highlights"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg><span class="button-label">Save PDF</span></button>
            </div>
        </div>
    </header>

    <div id="mainContainer">
        <main id="viewerContainer" aria-label="PDF document" tabindex="-1">
            <!-- Pages will be rendered here -->
            <div id="viewer" class="pdfViewer"></div>
        </main>
        <aside id="sidebar" class="hidden" aria-labelledby="sidebar-title">
            <div id="sidebar-header">
                <button id="close_sidebar" type="button" title="Close sidebar" aria-label="Close sidebar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                <h3 id="sidebar-title">Bookmarks</h3>
                <div id="sidebar-header-actions">
                    <!-- Additional icons could go here -->
                </div>
            </div>
            <div id="sidebar-annotation-filters" hidden>
                <div id="sidebar-annotation-colors" role="group" aria-label="Filter annotations by color"></div>
                <div class="sidebar-annotation-search-row">
                    <input id="sidebar-annotation-search" type="search" placeholder="Search highlights and notes" aria-label="Search highlights and notes" autocomplete="off">
                    <button id="sidebar-annotation-clear" type="button" disabled>Clear filters</button>
                </div>
            </div>
            <div id="sidebar-content-bookmarks" class="hidden">
                <!-- Bookmarks will be dynamically injected here -->
            </div>
            <div id="sidebar-content-comments" class="hidden">
                <!-- Highlights will be dynamically injected here -->
            </div>
            <div id="sidebar-content-outline" class="hidden">
                <!-- Outline will be dynamically injected here -->
            </div>
            <section id="sidebar-content-search" class="hidden" aria-label="Search results">
                <p id="search-panel-status" role="status" aria-live="polite">Enter a phrase in Find, then press Enter.</p>
                <ol id="search-result-list" aria-label="Matching passages"></ol>
                <div id="search-result-pagination" hidden>
                    <button id="search-results-previous" type="button" aria-label="Previous group of search results">Previous</button>
                    <span id="search-result-range"></span>
                    <button id="search-results-next" type="button" aria-label="Next group of search results">Next</button>
                </div>
            </section>
        </aside>
        
        <!-- Sidebar Icons Strip (Always visible on the right) -->
        <nav id="sidebar-icons" aria-label="Document panels">
            <button id="icon-tab-search" title="Search results" data-tab="search" type="button" aria-label="Search document and view results" aria-controls="sidebar" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Search</span></button>
            <button id="icon-tab-bookmarks" title="Bookmarks" data-tab="bookmarks" type="button" aria-label="Bookmarks" aria-controls="sidebar" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>Saved</span></button>
            <button id="icon-tab-outline" title="Outline" data-tab="outline" type="button" aria-label="Document outline" aria-controls="sidebar" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span>Outline</span></button>
            <button id="icon-tab-comments" title="Comments" data-tab="comments" type="button" aria-label="Comments and highlights" aria-controls="sidebar" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Notes</span></button>
            <button id="focus_mode_toggle" title="Focus mode (F)" type="button" aria-label="Enter focus mode" aria-pressed="false" aria-keyshortcuts="F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>Focus</span></button>
        </nav>
    </div>

    <div id="focus-controls" hidden role="group" aria-label="Focus mode controls">
        <button id="focus-show-controls" type="button" aria-expanded="false" aria-controls="toolbar sidebar-icons">Show controls</button>
        <button id="focus-exit" type="button" title="Exit focus mode (Escape)">Exit focus <kbd>Esc</kbd></button>
    </div>

    <!-- AI Popup is handled dynamically by content.js -->

    <!-- Color Picker Popup -->
    <div id="color-picker-popup" class="hidden">
        <div id="markup-tools">
            <button class="markup-tool-btn active" data-type="Highlight" title="Highlight"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
            <button class="markup-tool-btn" data-type="Underline" title="Underline"><u>U</u></button>
            <button class="markup-tool-btn" data-type="StrikeOut" title="Strikethrough"><s>S</s></button>
            <div style="flex:1"></div>
            <button id="ai-btn-new" title="Ask AI" style="background: none; border: none; cursor: pointer; color: #555; font-size: 14px; padding: 2px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></button>
            <button id="close-color-picker" aria-label="Close highlight tools" style="background: none; border: none; cursor: pointer; color: #666; font-size: 14px; padding: 2px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div id="color-tools" style="display: flex; gap: 5px; justify-content: center;">
            <button class="color-btn" style="background-color: #FFFF98;" data-color="#FFFF98" aria-label="Yellow highlight" title="Yellow"></button>
            <button class="color-btn" style="background-color: #53FFBC;" data-color="#53FFBC" aria-label="Green highlight" title="Green"></button>
            <button class="color-btn" style="background-color: #80EBFF;" data-color="#80EBFF" aria-label="Blue highlight" title="Blue"></button>
            <button class="color-btn" style="background-color: #FFCBE6;" data-color="#FFCBE6" aria-label="Pink highlight" title="Pink"></button>
            <button class="color-btn" style="background-color: #FF4F5F;" data-color="#FF4F5F" aria-label="Red highlight" title="Red"></button>
        </div>
    </div>

    <div id="edit-highlight-popup" class="hidden">
        <button id="edit-btn-ai" title="Ask AI"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></button>
        <button id="edit-btn-note" title="Add Note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
        <button id="edit-btn-color" title="Change Color"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg></button>
        <button id="edit-btn-trash" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>

    <!-- Note Editor Popup -->
    <div id="note-editor-popup" class="hidden">
        <div id="note-textarea" class="note-editor-content is-empty" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Add a note..."></div>
        <div id="note-editor-actions">
            <div class="note-editor-actions-left">
                <button id="note-btn-move" type="button" title="Drag to move · Double-click to reattach to text" aria-label="Move note box (double-click to reattach to text)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
                </button>
                <button id="note-btn-expand" type="button" title="Expand writing area" aria-label="Expand writing area">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                </button>
                <span id="note-save-status" class="note-save-status" aria-live="polite"></span>
            </div>
            <div class="note-editor-actions-right">
                <button id="note-btn-cancel" type="button">Close</button>
                <button id="note-btn-save" type="button">Done</button>
            </div>
        </div>
    </div>

    <!-- Hidden print surface: printPDF() renders every page into canvases
         here; @media print swaps it in for the virtualized viewer, which
         only holds the visible pages and would otherwise print blank. -->
    <div id="print-container"></div>
    <div id="print-overlay" class="hidden">
        <div id="print-overlay-card">
            <div id="print-progress">Preparing pages for printing…</div>
            <button id="print-cancel">Cancel</button>
        </div>
    </div>

    <script src="../../pdf-lib.min.js"></script>
    <script src="../../content.js"></script>
    <script type="module" src="custom-viewer.js"></script>
</body>
</html>
